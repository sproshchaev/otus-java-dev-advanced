spring:
  application:
    name: apache-camel-demo
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

# Настройки Kafka
kafka:
  bootstrap-servers: localhost:9093
  topics:
    queue1-messages: vowels-letters
    queue2-messages: consonant-letters

camel:
  springboot:
    main-run-controller: true

  # Конфигурация RabbitMQ для Camel
  component:
    spring-rabbitmq:
      # Эти параметры теперь будут браться из spring.rabbitmq.*
      auto-declare: false
      auto-declare-producer: true
      test-connection-on-startup: false  # Отключаем для отладки

    # Конфигурация Kafka для Camel
    kafka:
      brokers: ${kafka.bootstrap-servers}
      # Дополнительные настройки Kafka при необходимости
      # key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.apache.camel: INFO  # для Camel
    ru.otus.apache_camel_demo: INFO
    org.springframework.amqp: INFO  # для RabbitMQ
    org.apache.camel.component.springrabbit: INFO
    org.apache.camel.component.kafka: INFO  # для Kafka
    org.apache.kafka: INFO